<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Tu rutina | Pedro Barron</title>
<meta name="theme-color" content="#D71920">
<meta property="og:title" content="Tu rutina de hoy | Pedro Barron">
<meta property="og:description" content="Ábrela para ver cada ejercicio con su dibujo y su video.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Oswald:wght@500;600;700&family=Zilla+Slab:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Vista del cliente. Mismo sistema que la plataforma, el reel y membresías:
   marfil, rojo Pedro, línea negra gruesa, sombras sólidas y Pedro en pixel art. */
:root{
  --paper:#FFFDF0; --card:#FFFFF8; --ink:#151412; --ink-2:#5b574d;
  --line:#151412; --line-soft:#e2dcc6; --red:#D71920; --red-ink:#b3141a;
  --tint:#f7efd9; --tint-red:#fbe5df; --ok:#1d6b3a; --ok-bg:#dcefdf;
  --f-display:"Alfa Slab One","Rockwell Extra Bold","Rockwell",Georgia,serif;
  --f-cond:"Oswald","Arial Narrow","Roboto Condensed",sans-serif;
  --f-label:"Zilla Slab","Rockwell","Courier New",serif;
  --f-body:"Barlow","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
img{max-width:100%}
.page{max-width:540px;margin:0 auto;min-height:100dvh;background:var(--paper);padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
@media(min-width:620px){.page{border-left:3px solid var(--line);border-right:3px solid var(--line)}}

/* Franja y encabezado */
.strip{position:sticky;top:0;z-index:30;background:var(--red);color:var(--paper);font-family:var(--f-label);font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:12px;padding:calc(6px + env(safe-area-inset-top,0px)) 16px 6px;display:flex;justify-content:space-between;gap:10px;border-bottom:3px solid var(--line)}
.progress{height:6px;background:var(--tint);border-bottom:2px solid var(--line);position:sticky;top:calc(31px + env(safe-area-inset-top,0px));z-index:29}
.progress i{display:block;height:100%;width:0;background:var(--red);transition:width .35s cubic-bezier(.2,.9,.3,1)}
.head{display:flex;align-items:center;gap:10px;padding:14px 16px 0}
.head .badge{width:58px;height:auto;flex:none}
.head .word{width:min(70%,280px);height:auto}

/* Portada */
.cover{position:relative;padding:12px 16px 16px;border-bottom:3px solid var(--line)}
.kicker{display:flex;align-items:center;gap:10px;font-family:var(--f-label);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:13px;margin:6px 0 4px}
.kicker::after{content:"";flex:1;height:2px;background:var(--line)}
.title{font-family:var(--f-display);font-weight:400;text-transform:uppercase;color:var(--red);font-size:clamp(40px,13vw,64px);line-height:1;margin:0;text-wrap:balance;overflow-wrap:break-word}
.title.long{font-size:clamp(30px,9vw,46px)}
.stage-row{display:grid;grid-template-columns:minmax(0,1fr) 172px;gap:8px;align-items:end;margin-top:10px}
.lines{list-style:none;margin:0;padding:0 0 8px;display:grid;gap:9px;align-self:start}
.lines li{display:flex;gap:9px;align-items:baseline;font-family:var(--f-cond);font-weight:600;text-transform:uppercase;font-size:18px;line-height:1.05}
.lines li::before{content:"";width:10px;height:10px;flex:none;border-radius:50%;background:var(--red);border:2px solid var(--line);transform:translateY(-1px)}
.lines li.done{color:var(--ink-2);text-decoration:line-through;text-decoration-thickness:2px}
.lines li.done::before{background:var(--ok)}
.lines small{display:block;font-family:var(--f-label);font-weight:700;font-size:14px;color:var(--red-ink);letter-spacing:.03em;text-decoration:none}
.fig{position:relative;display:flex;flex-direction:column;align-items:center}
.ifbb{font-family:var(--f-cond);font-weight:600;letter-spacing:.06em;background:var(--ink);color:var(--paper);padding:1px 10px;border-radius:6px;font-size:13px;margin-top:10px}
.stage{position:relative;width:100%;height:230px}
.stage img{position:absolute;bottom:0;left:calc(50% - var(--a) * 1px);height:220px;width:auto;image-rendering:pixelated;image-rendering:crisp-edges;visibility:hidden}
.stage img.on{visibility:visible}
.stage.hop img.on{transform:translateY(-8px)}
.stage::after{content:"";position:absolute;left:4%;right:4%;bottom:-3px;height:3px;background:var(--line)}
.burst{position:absolute;right:-8px;top:-18px;width:84px;height:84px;background:var(--red);color:var(--paper);display:grid;place-items:center;text-align:center;font-family:var(--f-display);font-size:12px;line-height:1;clip-path:polygon(50% 0%,61% 18%,79% 9%,78% 30%,98% 33%,84% 50%,98% 67%,78% 70%,79% 91%,61% 82%,50% 100%,39% 82%,21% 91%,22% 70%,2% 67%,16% 50%,2% 33%,22% 30%,21% 9%,39% 18%);transform:rotate(-10deg);animation:wobble 3.4s ease-in-out infinite;z-index:2}
.burst b{display:block;font-size:26px;font-weight:400}
@keyframes wobble{0%,100%{transform:rotate(-10deg) scale(1)}50%{transform:rotate(-3deg) scale(1.07)}}
.note{margin-top:14px;border:2px solid var(--line);background:var(--card);padding:9px 12px;font-family:var(--f-cond);font-weight:500;font-size:17px;line-height:1.25;box-shadow:4px 4px 0 var(--red)}
.note b{display:block;font-family:var(--f-label);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--red-ink);margin-bottom:2px}
.totals{display:flex;justify-content:space-between;align-items:flex-end;margin-top:14px;gap:10px}
.totals .stamp{width:76px;animation:stamp 6s ease-in-out infinite}
@keyframes stamp{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(4deg)}}
.totals .sets{font-family:var(--f-display);text-transform:uppercase;font-size:16px;line-height:1.1;text-align:right}
.totals .sets b{color:var(--red);font-weight:400;font-size:26px}

/* Ejercicios */
.section{padding:20px 16px 4px}
.section h2{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-family:var(--f-display);font-weight:400;text-transform:uppercase;color:var(--red);font-size:26px;line-height:1;margin:0 0 14px;padding-bottom:8px;border-bottom:3px solid var(--line)}
.section h2 span{font-family:var(--f-label);font-weight:700;font-size:13px;letter-spacing:.06em;color:var(--ink)}
.ex{border:3px solid var(--line);background:#fff;margin-bottom:18px;transition:box-shadow .15s,background .2s}
.ex.done{background:var(--card);box-shadow:5px 5px 0 var(--ok)}
.ex-head{display:flex;gap:10px;align-items:baseline;padding:10px 12px 8px;border-bottom:2px solid var(--line)}
.ex-num{font-family:var(--f-display);font-size:28px;line-height:1;color:var(--red)}
.ex-name{font-family:var(--f-cond);font-weight:600;text-transform:uppercase;font-size:22px;line-height:1.05;flex:1}
.ex.done .ex-num{color:var(--ok)}
.media{position:relative;aspect-ratio:4/3;max-width:100%;background:#fff;overflow:hidden;border-bottom:2px solid var(--line)}
.media img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply;padding:8px}
.media video{width:100%;height:100%;object-fit:contain;background:#000;display:block}
.flip img:last-child{animation:frame 1.8s steps(1,end) infinite}
@keyframes frame{0%{opacity:0}50%{opacity:1}}
.tag-mov{position:absolute;top:8px;right:8px;background:var(--red);color:var(--paper);font-family:var(--f-label);font-weight:700;font-size:11px;padding:1px 7px;text-transform:uppercase;letter-spacing:.05em;z-index:1}
.tabs{display:flex;border-bottom:2px solid var(--line)}
.tabs button{flex:1;border:0;border-right:2px solid var(--line);background:var(--tint);padding:6px;font-family:var(--f-cond);font-weight:600;text-transform:uppercase;font-size:15px;cursor:pointer}
.tabs button:last-child{border-right:0}
.tabs button[aria-pressed="true"]{background:var(--red);color:var(--paper)}
.specs{display:grid;grid-template-columns:repeat(3,1fr)}
.specs div{padding:8px 10px;border-right:2px solid var(--line);min-width:0}
.specs div:last-child{border-right:0}
.specs b{display:block;font-family:var(--f-display);font-weight:400;font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums}
.specs span{font-family:var(--f-label);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
.tip{margin:0;padding:9px 12px;border-top:2px solid var(--line);font-size:15px;background:var(--tint)}
.tip::before{content:"Tip de Pedro: ";font-family:var(--f-label);font-weight:700;color:var(--red-ink)}
.actions{display:grid;grid-template-columns:1fr 1fr;border-top:2px solid var(--line)}
.actions button{border:0;padding:12px 8px;font-family:var(--f-cond);font-weight:600;font-size:17px;text-transform:uppercase;cursor:pointer;background:var(--card);min-height:48px}
.actions .rest{border-right:2px solid var(--line)}
.actions .rest:hover{background:var(--tint)}
.actions .mark{background:var(--red);color:var(--paper)}
.ex.done .actions .mark{background:var(--ok)}
.extlink{display:block;text-align:center;padding:8px;border-bottom:2px solid var(--line);font-family:var(--f-cond);font-weight:600;text-transform:uppercase;color:var(--red-ink);text-decoration:none;background:var(--tint)}

/* Estiramientos */
.stretch-row{display:grid;grid-template-columns:repeat(3,1fr);border-top:2px solid var(--line);border-left:2px solid var(--line);background:#fff}
.stretch-row figure{margin:0;border-right:2px solid var(--line);border-bottom:2px solid var(--line);padding:6px;text-align:center}
.stretch-row img{aspect-ratio:1;object-fit:contain;width:100%;mix-blend-mode:multiply}
.stretch-row figcaption{font-family:var(--f-cond);font-weight:600;text-transform:uppercase;font-size:12px}
.lead{margin:0 0 12px;color:var(--ink-2);font-size:15px}

/* Rutina completa */
.finish{margin:6px 16px 0;border:3px solid var(--line);background:var(--card);box-shadow:6px 6px 0 var(--red);padding:16px;text-align:center;display:grid;gap:6px;justify-items:center}
.finish h3{margin:0;font-family:var(--f-display);font-weight:400;text-transform:uppercase;color:var(--red);font-size:28px;line-height:1}
.finish p{margin:0;color:var(--ink-2)}
.finish .stage{height:150px;width:140px}.finish .stage img{height:144px;left:calc(50% - var(--a) * .6545px)}

.foot{display:flex;gap:12px;align-items:center;padding:18px 16px 8px;margin-top:18px;border-top:3px solid var(--line);color:var(--ink-2);font-size:14px}
.foot img{width:60px;flex:none}

/* Cronómetro de descanso */
.timer{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(540px,100%);z-index:40;background:var(--ink);color:var(--paper);border-top:3px solid var(--red);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:12px}
.timer .clock{font-family:var(--f-display);font-size:34px;line-height:1;font-variant-numeric:tabular-nums;min-width:96px}
.timer .lbl{flex:1;min-width:0;font-family:var(--f-label);font-weight:700;text-transform:uppercase;font-size:12px;letter-spacing:.06em}
.timer .lbl i{display:block;height:5px;background:#3a3833;margin-top:6px}
.timer .lbl i b{display:block;height:100%;background:var(--red);width:100%;transition:width 1s linear}
.timer button{border:2px solid var(--paper);background:transparent;color:var(--paper);padding:6px 12px;font-family:var(--f-cond);font-weight:600;text-transform:uppercase;cursor:pointer}
.timer.go{background:var(--red)}
.timer[hidden]{display:none}
.timer.go .lbl i b{background:var(--paper)}

/* Cargando / errores */
.loading{display:grid;place-items:center;gap:12px;padding:120px 16px;font-family:var(--f-label);font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.track{width:min(300px,80%);height:3px;background:var(--line);position:relative}
.track img{position:absolute;bottom:3px;left:0;width:56px;animation:corre 2.2s linear infinite, trote .35s ease-in-out infinite alternate}
@keyframes corre{from{left:-10%}to{left:90%}}
@keyframes trote{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-8px) rotate(3deg)}}
.empty{margin:40px 16px;border:3px dashed var(--line);padding:24px 18px;text-align:center;display:grid;gap:10px;justify-items:center;background:var(--card)}
.empty h2{margin:0;font-family:var(--f-display);font-weight:400;text-transform:uppercase;color:var(--red);font-size:24px}
.empty p{margin:0;color:var(--ink-2)}
.empty img{width:70px;animation:trote .7s ease-in-out infinite alternate}
.demo-note{margin:14px 16px 0;font-size:13px;color:var(--ink-2);text-align:center}

@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.flip img:last-child{opacity:0}}
</style>
</head>

const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const DIAS = ["Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];
const MESES = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
const fecha = s => { const [y, m, d] = s.split("-").map(Number); const f = new Date(y, m - 1, d); return `${DIAS[f.getDay()]} ${d} ${MESES[m - 1]}`; };
const pad = n => String(n).padStart(2, "0");
const mmss = s => `${Math.floor(s / 60)}:${pad(s % 60)}`;
const isVideo = u => /\.(mp4|webm|mov|m4v|ogg)(\?|#|$)/i.test(u || "") || /\/storage\/v1\/object\/public\//.test(u || "");
const imgSrc = p => !p ? "" : /^(data:|https?:|blob:)/.test(p) ? p : (CONFIG.BASE_IMG || "") + p;
const REDUCE = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- datos ---------- */
function hoyISO() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function demoData() {
  const reps = ["12", "12", "12", "10", "15"], tips = ["Baja hasta que el muslo quede paralelo al piso y sube empujando con los talones.", "", "Aguanta un segundo arriba con la pierna estirada.", "", "Estira completo abajo y sube hasta la punta."];
  return {
    demo: true, marca: "Pedro Barron", membresia: "VIP",
    rutina: { id: "demo", fecha: hoyISO(), titulo: "Pierna", descanso: false, nota: "Semana de fuerza: si te salen todas las repeticiones, sube un poco el peso la próxima vez." },
    items: DEMO_IMG.ej.map((e, i) => ({ orden: i + 1, series: 4, reps: reps[i], descanso_seg: i === 0 ? 120 : 90, nota: tips[i], ej: e })),
    estiramientos: DEMO_IMG.st
  };
}
async function rest(path) {
  const r = await fetch(`${CONFIG.SUPABASE_URL.replace(/\/$/, "")}/rest/v1/${path}`, { headers: { apikey: CONFIG.SUPABASE_ANON_KEY, Authorization: `Bearer ${CONFIG.SUPABASE_ANON_KEY}` } });
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}
async function loadData(rid) {
  const [rut] = await rest(`rutinas?id=eq.${encodeURIComponent(rid)}&select=*`);
  if (!rut) return null;
  const [rex, cfg, st, mb] = await Promise.all([
    rest(`rutina_ejercicios?rutina_id=eq.${encodeURIComponent(rid)}&select=*,ejercicios(*)&order=orden.asc`),
    rest("config?select=marca&limit=1").catch(() => []),
    rest("ejercicios?grupo=eq.Estiramientos&select=*").catch(() => []),
    rest(`membresias?id=eq.${encodeURIComponent(rut.membresia_id)}&select=nombre`).catch(() => [])
  ]);
  return {
    demo: false, marca: cfg[0]?.marca || "Pedro Barron", membresia: mb[0]?.nombre || "",
    rutina: rut,
    items: rex.map(x => ({ ...x, ej: x.ejercicios || { nombre: "Ejercicio", imagen: "", imagen2: "", video_url: "" } })),
    estiramientos: st.filter(e => e.imagen)
  };
}

/* ---------- progreso guardado en este teléfono ---------- */
let KEY = "pb-rutina";
const getDone = () => { try { return new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); } catch { return new Set(); } };
const setDone = s => { try { localStorage.setItem(KEY, JSON.stringify([...s])); } catch {} };

/* ---------- pintar ---------- */
const spritesHTML = (start = 0) => SPRITES.map((s, i) => `<img src="${s.u}" alt="" style="--a:${s.a}"${i === start ? ' class="on"' : ""}>`).join("");
function media(ej, i) {
  const dib = ej.imagen
    ? (ej.imagen2 ? `<div class="flip"><img src="${esc(imgSrc(ej.imagen))}" alt="${esc(ej.nombre)}"><img src="${esc(imgSrc(ej.imagen2))}" alt=""></div><span class="tag-mov">En movimiento</span>` : `<img src="${esc(imgSrc(ej.imagen))}" alt="${esc(ej.nombre)}" loading="lazy">`)
    : `<div class="stage" style="height:100%"><img class="on" src="${SPRITES[0].u}" alt="" style="--a:${SPRITES[0].a};height:80%;"></div>`;
  if (ej.video_url && isVideo(ej.video_url)) {
    return `<div class="tabs" role="group" aria-label="Ver ejercicio"><button data-tab="video" data-i="${i}" aria-pressed="true">Video</button><button data-tab="dibujo" data-i="${i}" aria-pressed="false">Dibujo</button></div>
      <div class="media" id="m-${i}" data-video="${esc(ej.video_url)}" data-name="${esc(ej.nombre)}"><video src="${esc(ej.video_url)}" controls playsinline preload="metadata"></video></div>
      <template id="t-${i}">${dib}</template>`;
  }
  return `<div class="media">${dib}</div>${ej.video_url ? `<a class="extlink" href="${esc(ej.video_url)}" target="_blank" rel="noopener">Ver video del ejercicio</a>` : ""}`;
}
let D = null;
function render() {
  const { rutina: r, items, marca, membresia } = D;
  const done = getDone();
  const total = items.reduce((a, x) => a + (Number(x.series) || 0), 0);
  const largo = (r.titulo || "").length > 9;
  const lines = items.slice(0, 6).map((x, i) => `<li class="${done.has(i) ? "done" : ""}"><span>${esc(x.ej.nombre)}<small>${esc(x.series)} × ${esc(x.reps)}</small></span></li>`).join("");
  const exs = items.map((x, i) => `
    <article class="ex${done.has(i) ? " done" : ""}" id="ex-${i}">
      <div class="ex-head"><span class="ex-num">${i + 1}</span><span class="ex-name">${esc(x.ej.nombre)}</span></div>
      ${media(x.ej, i)}
      <div class="specs"><div><b>${esc(x.series)}</b><span>Series</span></div><div><b>${esc(x.reps)}</b><span>Repeticiones</span></div><div><b>${Number(x.descanso_seg) ? mmss(Number(x.descanso_seg)) : "-"}</b><span>Descanso</span></div></div>
      ${x.nota ? `<p class="tip">${esc(x.nota)}</p>` : ""}
      <div class="actions">
        <button class="rest" data-rest="${Number(x.descanso_seg) || 60}" data-name="${esc(x.ej.nombre)}">Descanso ${mmss(Number(x.descanso_seg) || 60)}</button>
        <button class="mark" data-mark="${i}" aria-pressed="${done.has(i)}">${done.has(i) ? "Hecho ✓" : "Marcar hecho"}</button>
      </div>
    </article>`).join("");
  const allDone = items.length && done.size >= items.length;
  const st = D.estiramientos.length ? `<section class="section"><h2>Al terminar</h2><p class="lead">Realiza estiramientos al finalizar el entrenamiento.</p><div class="stretch-row">${D.estiramientos.slice(0, 6).map(e => `<figure><img src="${esc(imgSrc(e.imagen))}" alt="" loading="lazy"><figcaption>${esc(e.nombre.replace(/^Estiramiento de /, ""))}</figcaption></figure>`).join("")}</div></section>` : "";

  $("#app").innerHTML = `
    <div class="strip"><span>${r.descanso ? "Hoy descansas" : "Tu rutina de hoy"}</span><span>${esc(fecha(r.fecha))}</span></div>
    ${r.descanso ? "" : `<div class="progress" aria-hidden="true"><i style="width:${items.length ? (done.size / items.length) * 100 : 0}%"></i></div>`}
    <header class="head"><img class="badge" src="${M.emblema}" alt=""><img class="word" src="${M.wordmark}" alt="${esc(marca)}. Cambia tu físico"></header>
    <section class="cover">
      <p class="kicker">${membresia ? `Rutina ${esc(membresia)}` : "Rutina del día"}</p>
      <h1 class="title${largo ? " long" : ""}">${esc(r.titulo)}</h1>
      <div class="stage-row">
        ${r.descanso ? `<p class="lead" style="align-self:center;margin:0">Recupera: camina, toma agua y duerme bien. Mañana volvemos con todo.</p>` : `<ul class="lines">${lines}</ul>`}
        <div class="fig" aria-hidden="true">
          ${r.descanso ? "" : `<div class="burst"><span><b>${items.length}</b>ejercicios</span></div>`}
          <div class="stage" data-poses>${spritesHTML(r.descanso ? 6 : 0)}</div>
          <span class="ifbb">IFBB PRO</span>
        </div>
      </div>
      ${r.nota ? `<div class="note"><b>Nota de Pedro</b>${esc(r.nota)}</div>` : ""}
      <div class="totals"><img class="stamp" src="${M.emblema}" alt=""><div class="sets">${r.descanso ? "Recupera y<br>vuelve mañana" : `<b>${total}</b> series<br>en total`}</div></div>
    </section>
    ${r.descanso ? "" : `<section class="section"><h2>Los ejercicios <span id="count">${done.size} de ${items.length} hechos</span></h2>${exs}</section>`}
    ${allDone ? `<div class="finish"><div class="stage" data-poses>${spritesHTML(0)}</div><h3>¡Rutina completa!</h3><p>Buen trabajo. Ahora estira y avísale a Pedro cómo te fue.</p></div>` : ""}
    ${st}
    ${D.demo ? `<p class="demo-note">Rutina de ejemplo. Con el link de WhatsApp verás tu rutina real.</p>` : ""}
    <footer class="foot"><img src="${M.corredor}" alt=""><span>¿Dudas con algún ejercicio? Contesta el mensaje de WhatsApp y Pedro te responde.</span></footer>`;
  document.title = `${r.titulo} | ${marca}`;
}

/* ---------- interacción ---------- */
document.addEventListener("click", e => {
  const mk = e.target.closest("[data-mark]");
  if (mk) {
    const i = Number(mk.dataset.mark), s = getDone();
    s.has(i) ? s.delete(i) : s.add(i); setDone(s);
    const y = scrollY; render(); scrollTo(0, y);
    if (s.has(i) && s.size < D.items.length) { try { navigator.vibrate?.(30); } catch {} }
    if (s.size === D.items.length) $(".finish")?.scrollIntoView({ behavior: REDUCE ? "auto" : "smooth", block: "center" });
    return;
  }
  const rs = e.target.closest("[data-rest]");
  if (rs) return startTimer(Number(rs.dataset.rest), rs.dataset.name);
  const tb = e.target.closest("[data-tab]");
  if (tb) {
    const i = tb.dataset.i, box = $(`#m-${i}`);
    tb.parentElement.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b === tb));
    box.innerHTML = tb.dataset.tab === "video" ? `<video src="${box.dataset.video}" controls playsinline preload="metadata"></video>` : $(`#t-${i}`).innerHTML;
    return;
  }
  if (e.target.closest("#timer [data-stop]")) stopTimer();
});

let tInt = null;
function startTimer(sec, name) {
  clearInterval(tInt);
  const el = $("#timer"); let left = sec;
  const paint = () => {
    el.className = "timer" + (left <= 0 ? " go" : "");
    el.innerHTML = `<span class="clock">${left > 0 ? mmss(left) : "¡Va!"}</span><span class="lbl">${left > 0 ? "Descansando · " + esc(name) : "Siguiente serie"}<i><b style="width:${Math.max(0, left / sec) * 100}%"></b></i></span><button data-stop>${left > 0 ? "Saltar" : "Cerrar"}</button>`;
  };
  el.hidden = false; paint();
  tInt = setInterval(() => {
    left--; paint();
    if (left === 0) { try { navigator.vibrate?.([200, 100, 200]); } catch {} }
    if (left <= -6) stopTimer();
  }, 1000);
}
function stopTimer() { clearInterval(tInt); $("#timer").hidden = true; }

/* Pedro cambia de pose con un saltito, como en el reel */
setInterval(() => {
  if (REDUCE || document.hidden) return;
  document.querySelectorAll("[data-poses]").forEach(st => {
    const im = st.querySelectorAll("img"); const k = [...im].findIndex(x => x.classList.contains("on"));
    im[k]?.classList.remove("on"); im[(k + 1) % im.length].classList.add("on");
    st.classList.add("hop"); setTimeout(() => st.classList.remove("hop"), 70);
  });
}, 800);

/* ---------- arranque ---------- */
(async function () {
  const rid = new URLSearchParams(location.search).get("r");
  const real = CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY && rid;
  try {
    D = real ? await loadData(rid) : demoData();
    if (!D) {
      $("#app").innerHTML = `<div class="empty"><img src="${M.corredor}" alt=""><h2>Rutina no encontrada</h2><p>El link puede estar incompleto. Pídele a Pedro que te lo reenvíe por WhatsApp.</p></div>`;
      return;
    }
    KEY = "pb-rutina-" + (D.rutina.id || rid || "demo");
    render();
  } catch (err) {
    $("#app").innerHTML = `<div class="empty"><img src="${M.corredor}" alt=""><h2>No cargó tu rutina</h2><p>Revisa tu conexión y vuelve a abrir el link.</p><button onclick="location.reload()" style="border:3px solid var(--line);background:var(--red);color:var(--paper);padding:8px 18px;font-family:var(--f-cond);font-weight:600;text-transform:uppercase;box-shadow:4px 4px 0 var(--line)">Reintentar</button></div>`;
  }
})();
</script>
</body>
