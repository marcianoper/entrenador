<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta property="og:title" content="Tu rutina de hoy | Pedro Barron"><meta property="og:description" content="Ábrela para ver cada ejercicio con su dibujo y su video."><meta property="og:type" content="website"><meta property="og:image" content="img/og.jpg"><meta name="theme-color" content="#1f46a8"><title>Pedro Barron Rutinas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ultra&family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;0,900;1,800;1,900&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Concepto: las láminas de ejercicios de Pedro Barron hechas página. Papel blanco, marcos azules,
   figuras en rojo, titulares gordos en azul como sus hojas, y portadas de revista retro por día.
   Un solo tema claro, sin fondos negros. */
:root{
  --paper:#fbfaf6;      /* papel de las láminas */
  --card:#ffffff;
  --ink:#16255f;        /* azul marino de tinta, en lugar de negro */
  --ink-2:#4d5779;
  --line:#1f46a8;       /* azul de los marcos de sus hojas */
  --line-soft:#d5dbec;
  --red:#d42a1f;        /* rojo de las figuras y del logo */
  --blue:#1f46a8;
  --yellow:#f6c500;     /* amarillo de titular de revista, solo para acentos */
  --tint-blue:#eef2fb;
  --tint-red:#fdeeec;
  --ok:#1b7a3d; --ok-bg:#dcf1e3;
  --warn:#8a5a00; --warn-bg:#fcf0c8;
  --bad:#b5211a; --bad-bg:#fbe0dd;
  --muted-bg:#eceef4;
  --f-display:"Ultra","Rockwell Extra Bold","Rockwell",Georgia,serif;
  --f-cond:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --f-body:"Barlow","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
img{max-width:100%}
.wrap{max-width:1320px;margin:0 auto;padding-inline:clamp(16px,3vw,32px);padding-block:0 64px}

/* Franja superior */
.strip{background:var(--blue);color:#fff;font-family:var(--f-cond);font-weight:800;text-transform:uppercase;letter-spacing:.1em;font-size:14px;padding:6px clamp(16px,3vw,32px);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.demo-flag{background:var(--yellow);color:var(--ink);padding:0 8px}

/* Encabezado: logo + figura que cambia de pose */
.mast-row{display:grid;grid-template-columns:auto 1fr auto;gap:20px;align-items:center;padding-block:14px;border-bottom:3px solid var(--line)}
.lockup{width:clamp(220px,30vw,380px);height:auto;display:block;mix-blend-mode:multiply}
.mast-sub{font-family:var(--f-cond);font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:15px;color:var(--red);margin-top:4px}
.mast-right{display:flex;gap:16px;align-items:center;justify-content:flex-end}
.memb-switch{display:flex;gap:10px}
.memb{border:3px solid var(--line);background:var(--card);padding:8px 14px;cursor:pointer;text-align:left;min-width:120px;transition:transform .12s, box-shadow .12s;color:var(--ink)}
.memb:hover{box-shadow:4px 4px 0 var(--line)}
.memb:active{transform:translate(1px,1px);box-shadow:none}
.memb b{display:block;font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1.05;color:var(--blue)}
.memb span{font-size:13px;color:var(--ink-2)}
.memb[aria-pressed="true"]{background:var(--red);border-color:var(--red)}
.memb[aria-pressed="true"] b,.memb[aria-pressed="true"] span{color:#fff}

/* Flipbook de poses */
.poses{position:relative;aspect-ratio:1/2;flex:none}
.poses img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply;opacity:0;transform:scale(.96) translateY(4px);transition:opacity .28s ease, transform .45s cubic-bezier(.2,1.4,.4,1)}
.poses img.on{opacity:1;transform:none}
.poses-head{width:84px}
.pose-num{position:absolute;left:-6px;bottom:2px;font-family:var(--f-display);color:var(--red);font-size:22px;line-height:1}

/* Navegación */
.nav{display:flex;gap:6px;overflow-x:auto;padding-block:12px;border-bottom:1px solid var(--line-soft);margin-bottom:24px;scrollbar-width:thin}
.nav button{background:none;border:0;cursor:pointer;font-family:var(--f-cond);font-weight:800;text-transform:uppercase;font-size:20px;padding:4px 12px;white-space:nowrap;letter-spacing:.02em;color:var(--blue)}
.nav button:hover{color:var(--red)}
.nav button[aria-current="page"]{background:var(--yellow);color:var(--ink);box-shadow:3px 3px 0 var(--line)}

/* Tipografía */
h2.headline{font-family:var(--f-display);font-weight:400;text-transform:uppercase;color:var(--blue);font-size:clamp(28px,4.2vw,46px);line-height:1;margin:0;text-wrap:balance}
.dek{color:var(--ink-2);max-width:62ch;margin:8px 0 0}
.section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* Botones */
.btn{border:2px solid var(--line);background:var(--card);color:var(--blue);padding:8px 14px;font-family:var(--f-cond);font-weight:800;text-transform:uppercase;letter-spacing:.04em;font-size:16px;cursor:pointer;white-space:nowrap;transition:transform .1s, box-shadow .1s}
.btn:hover{box-shadow:3px 3px 0 var(--line)}
.btn:active{transform:translate(1px,1px);box-shadow:none}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.primary:hover{box-shadow:3px 3px 0 var(--ink)}
.btn.small{padding:4px 10px;font-size:14px}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{box-shadow:none;color:var(--red)}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.danger-armed{background:var(--bad);border-color:var(--bad);color:#fff}

/* Semana: portadas */
.week-nav{display:flex;align-items:center;gap:6px}
.covers{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.cover{--c:var(--red);--c-ink:#fff;position:relative;border:3px solid var(--line);min-height:320px;display:flex;flex-direction:column;cursor:pointer;text-align:left;padding:0;background:var(--card);color:var(--ink);transition:transform .15s, box-shadow .15s;overflow:hidden;animation:rise .45s cubic-bezier(.2,.9,.3,1) both;animation-delay:calc(var(--i,0) * 50ms)}
@keyframes rise{from{transform:translateY(10px)}to{transform:none}}
.cover:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--line)}
.cover .band{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;font-family:var(--f-cond);font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:14px;background:var(--c);color:var(--c-ink)}
.cover .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px;flex:1;position:relative}
.cover .title{font-family:var(--f-display);font-weight:400;text-transform:uppercase;font-size:30px;line-height:1;margin:0;color:var(--c);overflow-wrap:break-word;text-wrap:balance}
.c-yellow{--c:var(--yellow);--c-ink:var(--ink)}
.c-yellow .title{color:var(--ink);text-decoration:underline;text-decoration-color:var(--yellow);text-decoration-thickness:6px;text-underline-offset:2px}
.c-blue{--c:var(--blue)}
.c-red{--c:var(--red)}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.thumbs span{aspect-ratio:1;border:1px solid var(--line-soft);background:#fff;display:grid;place-items:center;overflow:hidden}
.thumbs img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}
.cover ul{list-style:none;margin:0;padding:0;display:grid;gap:3px}
.cover li{font-family:var(--f-cond);font-weight:700;text-transform:uppercase;font-size:15px;line-height:1.1;display:flex;gap:8px;align-items:baseline;color:var(--ink)}
.cover li::before{content:"";width:8px;height:8px;flex:none;background:var(--c);transform:translateY(-1px)}
.c-yellow li::before{background:var(--red)}
.cover .more{font-family:var(--f-cond);font-weight:700;font-size:15px;color:var(--ink-2)}
.cover .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink-2)}
.cover.rest{--c:var(--line-soft);--c-ink:var(--ink);background:repeating-linear-gradient(-45deg,#fff 0 12px,var(--tint-blue) 12px 24px)}
.cover.rest .title{color:var(--blue)}
.cover.rest .rest-fig{position:absolute;right:10px;bottom:10px;width:78px;opacity:.9}
.cover.empty{border-style:dashed;--c:var(--muted-bg);--c-ink:var(--ink-2)}
.cover.empty .title{font-size:24px;color:var(--ink-2)}
.cover.today{outline:4px solid var(--yellow);outline-offset:3px}
.burst{position:absolute;right:-4px;top:26px;width:78px;height:78px;background:var(--yellow);color:var(--red);display:grid;place-items:center;font-family:var(--f-cond);font-weight:900;font-style:italic;font-size:20px;clip-path:polygon(50% 0%,61% 18%,79% 9%,78% 30%,98% 33%,84% 50%,98% 67%,78% 70%,79% 91%,61% 82%,50% 100%,39% 82%,21% 91%,22% 70%,2% 67%,16% 50%,2% 33%,22% 30%,21% 9%,39% 18%);transform:rotate(12deg);z-index:2;animation:wobble 3.2s ease-in-out infinite}
@keyframes wobble{0%,100%{transform:rotate(12deg) scale(1)}50%{transform:rotate(4deg) scale(1.06)}}
.c-yellow .burst{background:var(--red);color:#fff}
.cover.today .title{padding-right:66px}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:2px 8px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.muted{background:var(--muted-bg);color:var(--ink-2)}
.chip.info{background:var(--tint-blue);color:var(--blue)}

/* Resumen de semana */
.summary{display:flex;gap:28px;flex-wrap:wrap;margin:0 0 22px;padding:12px 0;border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft)}
.summary div{display:flex;flex-direction:column}
.summary b{font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1.05;font-variant-numeric:tabular-nums;color:var(--blue)}
.summary b.alert{color:var(--red)}
.summary span{font-size:13px;color:var(--ink-2)}

/* Formularios */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-family:var(--f-cond);font-weight:800;text-transform:uppercase;letter-spacing:.05em;font-size:14px;color:var(--blue)}
.field .help{font-size:13px;color:var(--ink-2)}
input[type=text],input[type=tel],input[type=date],input[type=time],input[type=number],input[type=url],input[type=email],input[type=password],input[type=search],select,textarea{width:100%;border:2px solid var(--line);background:#fff;padding:8px 10px;border-radius:0;color:var(--ink)}
textarea{resize:vertical;min-height:72px}
input::placeholder,textarea::placeholder{color:#6d7593}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.err{color:var(--bad);font-size:13px;font-weight:600}

/* Diálogo */
dialog{border:3px solid var(--line);background:var(--paper);color:var(--ink);padding:0;width:min(780px,calc(100vw - 24px));max-height:calc(100dvh - 24px);box-shadow:10px 10px 0 var(--line)}
dialog::backdrop{background:rgba(22,37,95,.45)}
.dlg-head{position:sticky;top:0;z-index:2;background:var(--blue);color:#fff;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.dlg-head h3{margin:0;font-family:var(--f-display);font-weight:400;text-transform:uppercase;font-size:24px;line-height:1.05}
.dlg-head .btn{background:transparent;border-color:#fff;color:#fff}
.dlg-body{padding:18px;display:grid;gap:18px}
.dlg-foot{position:sticky;bottom:0;background:var(--paper);border-top:2px solid var(--line);padding:12px 18px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.swatches{display:flex;gap:8px}
.swatch{width:40px;height:40px;border:3px solid var(--line);cursor:pointer;background:var(--c)}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 3px var(--paper),0 0 0 6px var(--line)}
.toggle{display:flex;gap:10px;align-items:center;font-weight:600}
.toggle input{width:20px;height:20px;accent-color:var(--red)}

.picker{border:2px solid var(--line);background:#fff}
.picker-top{display:flex;gap:8px;padding:8px;border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
.picker-top select{width:auto;flex:none}
.picker-top input{flex:1;min-width:140px}
.picker-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;padding:8px;max-height:260px;overflow-y:auto}
.pick{border:2px solid var(--line-soft);background:#fff;cursor:pointer;padding:4px;display:flex;flex-direction:column;gap:2px;text-align:center;transition:border-color .1s, transform .1s}
.pick:hover{border-color:var(--red);transform:translateY(-1px)}
.pick img{aspect-ratio:1;object-fit:contain;width:100%;mix-blend-mode:multiply}
.pick span{font-family:var(--f-cond);font-weight:700;text-transform:uppercase;font-size:12px;line-height:1.05;color:var(--blue)}

.ex-list{display:grid;gap:10px}
.ex-row{display:grid;grid-template-columns:34px 76px 1fr auto;gap:12px;align-items:start;border:2px solid var(--line);background:#fff;padding:10px}
.ex-num{font-family:var(--f-display);font-size:26px;line-height:1;color:var(--red)}
.ex-img{width:76px;height:76px;object-fit:contain;mix-blend-mode:multiply;border:1px solid var(--line-soft)}
.ex-name{font-family:var(--f-cond);font-weight:800;text-transform:uppercase;font-size:19px;line-height:1.1;color:var(--blue)}
.ex-fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.ex-fields .field label{font-size:12px}
.ex-fields input{padding:6px 8px}
.ex-note{margin-top:8px}
.ex-actions{display:flex;flex-direction:column;gap:4px}

/* Tablas */
.table-wrap{overflow-x:auto;border:3px solid var(--line);background:#fff}
table{border-collapse:collapse;width:100%;min-width:720px}
th{font-family:var(--f-cond);font-weight:800;text-transform:uppercase;letter-spacing:.05em;font-size:14px;text-align:left;padding:10px 12px;background:var(--blue);color:#fff}
td{padding:10px 12px;border-top:1px solid var(--line-soft);vertical-align:middle}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.cell-name{font-weight:700}
.row-actions{display:flex;gap:4px;justify-content:flex-end}

/* Biblioteca: lámina */
.sheet{border:3px solid var(--line);background:#fff;margin-bottom:22px}
.sheet-head{display:flex;align-items:center;gap:12px;border-bottom:2px solid var(--line);padding:8px 14px}
.sheet-head h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(24px,3.4vw,36px);line-height:1;color:var(--blue);text-transform:uppercase}
.sheet-head span{margin-left:auto;font-size:13px;color:var(--ink-2)}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.lib-item{border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;cursor:pointer;background:#fff;text-align:center;padding:10px 8px 8px;gap:6px;transition:background .15s}
.lib-item:hover{background:var(--tint-red)}
.lib-item:hover .lib-media img{transform:scale(1.04)}
.lib-media{aspect-ratio:1;max-width:100%;position:relative;overflow:hidden}
.lib-media img,.lib-media video{width:100%;height:100%;object-fit:contain;display:block;transition:transform .25s}
.lib-media img{mix-blend-mode:multiply}
.lib-item h4{margin:0;font-family:var(--f-cond);font-weight:800;text-transform:uppercase;font-size:16px;line-height:1.05;color:var(--blue)}
.lib-meta{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;font-size:12px;color:var(--ink-2)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.pill{border:2px solid var(--line);background:#fff;color:var(--blue);padding:3px 12px;font-family:var(--f-cond);font-weight:700;text-transform:uppercase;cursor:pointer;font-size:15px}
.pill[aria-pressed="true"]{background:var(--blue);color:#fff}

/* Dos cuadros: la figura alterna entre posición inicial y final */
.flip{position:relative;width:100%;height:100%}
.flip img{position:absolute;inset:0}
.flip img:last-child{animation:frame 1.8s steps(1,end) infinite}
@keyframes frame{0%{opacity:0}50%{opacity:1}}
.anim-tag{position:absolute;top:4px;right:4px;background:var(--yellow);color:var(--ink);font-family:var(--f-cond);font-weight:800;font-size:11px;padding:1px 6px;text-transform:uppercase;letter-spacing:.05em}

/* Envíos */
.send-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:24px;align-items:start}
.panel{border:3px solid var(--line);background:#fff;padding:16px;display:grid;gap:14px}
.panel h3{margin:0;font-family:var(--f-display);font-weight:400;text-transform:uppercase;font-size:22px;line-height:1.05;color:var(--blue)}
.msg-preview{background:#dcf8c6;color:#111b21;padding:10px 12px;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere;border-radius:2px 10px 10px 10px;max-width:42ch;box-shadow:0 1px 0 rgba(0,0,0,.15)}
.bot{display:grid;gap:6px;justify-items:start}.bot p{margin:0;font-size:14px}
.callout{border-left:6px solid var(--yellow);background:var(--tint-blue);padding:10px 14px;font-size:14px}

/* Vista del cliente */
.preview-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px);gap:28px;align-items:start}
.phone{max-width:430px;width:100%;margin-inline:auto;border:10px solid var(--blue);border-radius:28px;overflow:hidden;background:var(--paper);box-shadow:8px 8px 0 var(--line-soft)}
.client{background:var(--paper);color:var(--ink)}
.mag{--c:var(--red);position:relative;overflow:hidden;background:#fff;border-bottom:4px solid var(--line);display:flex;flex-direction:column;min-height:600px}
.mag::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(31,70,168,.09) 1.1px,transparent 1.6px);background-size:7px 7px;pointer-events:none}
.mag.c-blue{--c:var(--blue)}.mag.c-yellow{--c:var(--yellow)}
.mag > *{position:relative}
.mag-top{background:var(--c);color:#fff;font-family:var(--f-cond);font-weight:800;text-transform:uppercase;font-size:13px;letter-spacing:.08em;padding:5px 14px;display:flex;justify-content:space-between;gap:8px}
.mag.c-yellow .mag-top{color:var(--ink)}
.mag-lockup{width:min(78%,300px);margin:12px 14px 0;mix-blend-mode:multiply}
.mag-title{font-family:var(--f-display);font-weight:400;text-transform:uppercase;font-size:clamp(40px,12.5vw,60px);line-height:.95;padding:14px 14px 0;margin:0;color:var(--c);overflow-wrap:break-word;text-wrap:balance}
.mag.c-yellow .mag-title{color:var(--blue)}
.mag-title.long{font-size:clamp(30px,9vw,44px)}
.mag-stage{display:grid;grid-template-columns:1fr 42%;gap:6px;padding:10px 14px 0;align-items:end;flex:1}
.mag-lines{list-style:none;margin:0;padding:0 0 10px;display:grid;gap:7px;align-self:start}
.mag-lines li{font-family:var(--f-cond);font-weight:800;text-transform:uppercase;font-size:18px;line-height:1.05;display:flex;gap:8px;align-items:baseline;color:var(--ink)}
.mag-lines li::before{content:"";width:10px;height:10px;flex:none;background:var(--red)}
.mag-lines li small{display:block;font-size:14px;font-weight:700;color:var(--red);margin-top:1px}
.mag-figure{position:relative}
.mag-figure .poses{width:100%}
.mag-box{margin:6px 14px 0;border:2px solid var(--line);background:#fff;padding:8px 10px;font-family:var(--f-cond);font-weight:700;font-size:16px;line-height:1.15;color:var(--ink)}
.mag-box b{display:block;text-transform:uppercase;font-size:13px;letter-spacing:.08em;color:var(--red)}
.mag-burst{position:absolute;right:12px;top:118px;width:96px;height:96px;background:var(--yellow);color:var(--red);display:grid;place-items:center;text-align:center;font-family:var(--f-cond);font-weight:900;font-style:italic;font-size:19px;line-height:.9;clip-path:polygon(50% 0%,61% 18%,79% 9%,78% 30%,98% 33%,84% 50%,98% 67%,78% 70%,79% 91%,61% 82%,50% 100%,39% 82%,21% 91%,22% 70%,2% 67%,16% 50%,2% 33%,22% 30%,21% 9%,39% 18%);transform:rotate(-10deg);z-index:3;animation:wobble2 3.4s ease-in-out infinite}
@keyframes wobble2{0%,100%{transform:rotate(-10deg) scale(1)}50%{transform:rotate(-3deg) scale(1.07)}}
.mag.c-yellow .mag-burst{background:var(--red);color:#fff}
.mag-foot{display:flex;justify-content:space-between;align-items:flex-end;padding:14px;gap:10px}

/* ---------- capa de datos: demo en memoria o Supabase ---------- */
const DEMO = !CONFIG.SUPABASE_URL || !CONFIG.SUPABASE_ANON_KEY;
let sb = null;
const mem = DEMO ? seed() : null;
const DB = {
  async all(t) { if (DEMO) return structuredClone(mem[t]); const { data, error } = await sb.from(t).select("*"); if (error) throw error; return data; },
  async where(t, f, v) { if (DEMO) return structuredClone(mem[t].filter(r => r[f] === v)); const { data, error } = await sb.from(t).select("*").eq(f, v); if (error) throw error; return data; },
  async insert(t, row) { if (DEMO) { const r = { id: uid(), ...row }; mem[t].push(r); return structuredClone(r); } const { data, error } = await sb.from(t).insert(row).select().single(); if (error) throw error; return data; },
  async insertMany(t, rows) { if (!rows.length) return []; if (DEMO) { const rs = rows.map(r => ({ id: uid(), ...r })); mem[t].push(...rs); return structuredClone(rs); } const { data, error } = await sb.from(t).insert(rows).select(); if (error) throw error; return data; },
  async update(t, id, patch) { if (DEMO) { const r = mem[t].find(x => x.id === id); Object.assign(r, patch); return structuredClone(r); } const { data, error } = await sb.from(t).update(patch).eq("id", id).select().single(); if (error) throw error; return data; },
  async remove(t, id) { if (DEMO) { mem[t] = mem[t].filter(x => x.id !== id); return; } const { error } = await sb.from(t).delete().eq("id", id); if (error) throw error; },
  async removeWhere(t, f, v) { if (DEMO) { mem[t] = mem[t].filter(x => x[f] !== v); return; } const { error } = await sb.from(t).delete().eq(f, v); if (error) throw error; },
  async upload(file) {
    if (DEMO) return URL.createObjectURL(file);
    const path = `${Date.now()}-${file.name.normalize("NFD").replace(/[^\w.-]/g, "_")}`;
    const { error } = await sb.storage.from(CONFIG.BUCKET_VIDEOS).upload(path, file, { contentType: file.type });
    if (error) throw error;
    return sb.storage.from(CONFIG.BUCKET_VIDEOS).getPublicUrl(path).data.publicUrl;
  }
};

/* ---------- lógica de negocio ---------- */
const SIN_EJ = { nombre: "Ejercicio eliminado", grupo: "", imagen: "", imagen2: "", video_url: "" };
const rutinaDe = (memb, fecha) => S.rutinas.find(r => r.membresia_id === memb && r.fecha === fecha);
const ejDe = id => S.ejercicios.find(e => e.id === id) || SIN_EJ;
const itemsDe = rid => S.rex.filter(x => x.rutina_id === rid).sort((a, b) => a.orden - b.orden).map(x => ({ ...x, ej: ejDe(x.ejercicio_id) }));
function estadoCliente(c) {
  if (!c.activo) return { k: "muted", t: "Pausado", recibe: false };
  const d = diffDays(HOY, c.vence);
  if (d < 0) return { k: "bad", t: `Vencida hace ${-d} d`, recibe: false };
  if (d <= 5) return { k: "warn", t: d === 0 ? "Vence hoy" : `Vence en ${d} d`, recibe: true };
  return { k: "ok", t: "Activo", recibe: true };
}
const receptores = memb => S.clientes.filter(c => c.membresia_id === memb && estadoCliente(c).recibe);
const membNombre = id => (S.membresias.find(m => m.id === id) || {}).nombre || id;
const linkCliente = (rutinaId, clienteId) => { const base = S.config.url_vista || ""; return `${base}${base.includes("?") ? "&" : "?"}r=${rutinaId}${clienteId ? "&c=" + clienteId : ""}`; };
const mensaje = (c, r) => (S.config.plantilla || "").replaceAll("{nombre}", c.nombre.split(" ")[0]).replaceAll("{titulo}", (r?.titulo || "").toLowerCase()).replaceAll("{link}", r ? linkCliente(r.id, c.id) : "");

function vSemana() {

  const ini = parse(S.week), fin = parse(addDays(S.week, 6));
  const rango = ini.getMonth() === fin.getMonth() ? `${ini.getDate()} al ${fin.getDate()} de ${MESES[fin.getMonth()]}` : `${ini.getDate()} ${MESES[ini.getMonth()]} al ${fin.getDate()} ${MESES[fin.getMonth()]}`;

    </div>
  </div>

    <div><b>${planeados}/7</b><span>días planeados</span></div>
    <div><b>${entrenos}</b><span>días de entrenamiento</span></div>
    <div><b>${receptores(S.memb).length}</b><span>clientes reciben la rutina</span></div>
    <div><b class="${sinVideo ? "alert" : ""}">${sinVideo}</b><span>ejercicios sin video propio</span></div>
  </div>
  <div class="covers">${dias.map((f, i) => coverCard(f, rs[i], i)).join("")}</div>`;

function coverCard(f, r, i) {
  const d = parse(f);
  const band = `<div class="band"><span>${DIAS[dayIdx(f)]}</span><span>${d.getDate()} ${MESES[d.getMonth()].slice(0, 3)}</span></div>`;
  const hoy = f === HOY ? '<span class="burst" aria-hidden="true">¡HOY!</span>' : "";
  const base = `style="--i:${i}" data-act="edit" data-f="${f}"`;
  const todayCls = f === HOY ? " today" : "";
  if (!r) return `<button class="cover empty${todayCls}" ${base}>${band}<div class="body"><p class="title">Sin rutina</p><p class="more">Toca para armar este día</p></div></button>`;
  if (r.descanso) return `<button class="cover rest${todayCls}" ${base}>${band}${hoy}<div class="body"><p class="title">${esc(r.titulo || "Descanso")}</p>${r.nota ? `<p class="more">${esc(r.nota)}</p>` : ""}<div class="foot"><span class="chip muted">No se envía</span></div><img class="rest-fig" src="${POSES[6]}" alt=""></div></button>`;
  const items = itemsDe(r.id);
  const env = S.envios.filter(e => e.rutina_id === r.id);
  const ok = env.filter(e => e.estado === "enviado").length, bad = env.filter(e => e.estado === "fallo").length;
  let estado;
  if (f < HOY) estado = env.length ? `<span class="chip ${bad ? "warn" : "ok"}">${ok} enviados${bad ? `, ${bad} falló` : ""}</span>` : `<span class="chip muted">Sin registro</span>`;
  else if (f === HOY) estado = env.length ? `<span class="chip ${bad ? "warn" : "ok"}">${ok}/${env.length} enviados</span>` : `<span class="chip warn">Pendiente</span>`;
  else estado = `<span class="chip info">Sale ${esc(S.config.hora_envio || "")}</span>`;
  return `<button class="cover c-${colorOk(r.color)}${todayCls}" ${base}>${band}${hoy}
    <div class="body"><p class="title">${esc(r.titulo)}</p>
      ${items.length ? `<div class="thumbs">${items.slice(0, 4).map(x => `<span>${x.ej.imagen ? `<img src="${esc(x.ej.imagen)}" alt="" loading="lazy">` : ""}</span>`).join("")}</div>` : ""}
      <ul>${items.slice(0, 4).map(x => `<li>${esc(x.ej.nombre)}</li>`).join("")}</ul>
      ${items.length > 4 ? `<span class="more">y ${items.length - 4} más</span>` : ""}
      ${!items.length ? `<span class="more">Aún sin ejercicios</span>` : ""}
      <div class="foot"><span>${items.length} ejercicios</span>${estado}</div>
    </div></button>`;
}

async function saveDay() {

    if (!e.descanso) await DB.insertMany("rutina_ejercicios", e.items.map((it, i) => ({ rutina_id: r.id, ejercicio_id: it.ejercicio_id, orden: i + 1, series: Number(it.series) || 1, reps: String(it.reps || ""), descanso_seg: Number(it.descanso_seg) || 0, nota: it.nota || "" })));

async function deleteDay() {

async function copyWeek() {
  let n = 0;
  try {
    for (let i = 0; i < 7; i++) {
      const f = addDays(S.week, i), src = rutinaDe(S.memb, addDays(f, -7));
      if (!src || rutinaDe(S.memb, f)) continue;
      const r = await DB.insert("rutinas", { membresia_id: S.memb, fecha: f, titulo: src.titulo, color: src.color, descanso: src.descanso, nota: src.nota });
      await DB.insertMany("rutina_ejercicios", itemsDe(src.id).map(x => ({ rutina_id: r.id, ejercicio_id: x.ejercicio_id, orden: x.orden, series: x.series, reps: x.reps, descanso_seg: x.descanso_seg, nota: x.nota })));
      n++;
    }
    await loadAll(); render();
    toast(n ? `Se copiaron ${n} días. Los días que ya tenían rutina no se tocaron.` : "Esta semana ya tiene todos los días armados.");

}

function botHTML() {
  if (DEMO) return `<div class="bot ok"><span class="chip ok">Conectado</span><p>Simulado: sesión pedro-barron, revisado hace unos segundos.</p></div><p class="dek" style="margin:0;font-size:13px">Con Supabase conectado, aquí ves si el programa de envío está prendido y si WhatsApp está listo.</p>`;
  const raw = S.config.bot_estado || "", visto = S.config.bot_visto ? new Date(S.config.bot_visto) : null;
  const [k, ...t] = raw.split("|"), texto = t.join("|");
  if (!visto) return `<div class="bot bad"><span class="chip bad">Sin señal</span><p>El programa de envío nunca se ha conectado. Ábrelo con doble clic en INICIAR_ENVIOS.bat en la computadora de OpenWA.</p></div>`;
  const min = Math.round((Date.now() - visto) / 60000);
  const hace = min < 1 ? "hace unos segundos" : min === 1 ? "hace 1 minuto" : min < 60 ? `hace ${min} minutos` : `el ${visto.toLocaleString("es-MX", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })}`;
  if (min > 3) return `<div class="bot bad"><span class="chip bad">Apagado</span><p>El programa de envío no responde desde ${esc(hace)}. Revisa que la computadora esté prendida y que la ventana de INICIAR_ENVIOS siga abierta.</p></div>`;
  return `<div class="bot ${k === "ok" ? "ok" : "warn"}"><span class="chip ${k === "ok" ? "ok" : "warn"}">${k === "ok" ? "Conectado" : "Revisar"}</span><p>${esc(texto)} Revisado ${esc(hace)}.</p></div>`;
}
let envT = null;
function autoRefreshEnvios() {
  clearInterval(envT); envT = null;
  if (DEMO || S.view !== "envios") return;
  envT = setInterval(async () => {
    if (S.view !== "envios" || document.hidden || $("#dlg").open) return;
    try {
      const [envios, config] = await Promise.all([DB.all("envios"), DB.all("config")]);
      S.envios = envios; S.config = config[0] || S.config;
      const y = window.scrollY; render(); window.scrollTo(0, y);
    } catch {}
  }, 20000);
}
async function sendNow(rid, memb) {
  const ya = new Set(S.envios.filter(e => e.rutina_id === rid).map(e => e.cliente_id));
  const rows = receptores(memb).filter(c => !ya.has(c.id)).map(c => ({ rutina_id: rid, cliente_id: c.id, fecha: S.envFecha, estado: "pendiente", error: "", enviado_at: null }));
  try {
    let ins = [];
    if (DEMO) ins = await DB.insertMany("envios", rows);
    else if (rows.length) { const { error } = await sb.from("envios").upsert(rows, { onConflict: "rutina_id,cliente_id", ignoreDuplicates: true }); if (error) throw error; }
    if (DEMO) {
      ins.forEach(r => { const m = mem.envios.find(x => x.id === r.id); m.estado = "enviado"; m.enviado_at = `${S.envFecha}T${new Date().toTimeString().slice(0, 8)}`; });
      toast(`Simulado: ${rows.length} mensajes enviados. En tu sistema real quedan en cola para OpenWA.`);
    } else toast(`${rows.length} mensajes en cola. El programa de envío los manda en el siguiente minuto.`);
    await loadAll(); render();
  } catch (err) { toast("No se pudo poner en cola: " + err.message); }
}
async function resend(id) {
  try {
    await DB.update("envios", id, DEMO ? { estado: "enviado", error: "", enviado_at: `${HOY}T${new Date().toTimeString().slice(0, 8)}` } : { estado: "reenviar", error: "" });
    await loadAll(); render(); toast(DEMO ? "Simulado: reenviado." : "Reenvío en cola. Sale en el siguiente minuto.");
  } catch (err) { toast("No se pudo reenviar: " + err.message); }
}

/* ---------- página del cliente (portada + ejercicios) ---------- */
function mediaCliente(ej) {
  const dibujo = ilustracion(ej, false);
  if (ej.video_url && isDirectVideo(ej.video_url)) return `<div class="art-media"><video src="${esc(ej.video_url)}" controls playsinline preload="metadata" poster=""></video></div><details><summary style="cursor:pointer;font-size:13px;color:var(--blue);font-weight:600">Ver el dibujo</summary><div class="art-media" style="margin-top:6px">${dibujo}</div></details>`;
  if (ej.video_url) return `<div class="art-media">${dibujo}</div><a class="btn small" href="${esc(ej.video_url)}" target="_blank" rel="noopener" style="justify-self:start;text-decoration:none">Ver video</a>`;
  return `<div class="art-media">${dibujo}</div>`;
}
function clientePage(r, items, marca, estiramientos, opts = {}) {
  const f = r.fecha, d = parse(f), color = colorOk(r.color);
  const totalSeries = items.reduce((a, x) => a + (Number(x.series) || 0), 0);
  const cover = `
  <div class="mag c-${color}">
    <div class="mag-top"><span>${opts.saludo ? esc(opts.saludo) : "Tu rutina de hoy"}</span><span>${esc(DIAS[dayIdx(f)])} ${d.getDate()} ${MESES[d.getMonth()].slice(0, 3)}</span></div>
    <img class="mag-lockup" src="img/lockup.webp" alt="${esc(marca)}. Cambia tu físico">
    <h1 class="mag-title${r.titulo.length > 9 ? " long" : ""}">${esc(r.titulo)}</h1>
    ${r.descanso ? `<div class="rest-figure">${posesHTML("", 5)}</div>` : `
    <div class="mag-burst" aria-hidden="true">${items.length}<br>ejercicios</div>
    <div class="mag-stage">
      <ul class="mag-lines">${items.slice(0, 6).map(x => `<li><span>${esc(x.ej.nombre)}<small>${esc(x.series)} × ${esc(x.reps)}</small></span></li>`).join("")}</ul>
      <div class="mag-figure">${posesHTML()}</div>
    </div>`}
    ${r.nota ? `<div class="mag-box"><b>Nota del entrenador</b>${esc(r.nota)}</div>` : ""}
    <div class="mag-foot"><div class="barcode"><i></i>${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}</div><div class="sets">${r.descanso ? "Recupera y<br>vuelve mañana" : `${totalSeries} series<br>en total`}</div></div>
  </div>`;
  const arts = r.descanso ? "" : `
  <div class="articles"><h3>Los ejercicios</h3>
    ${items.map((x, i) => `<article class="art">
      <div class="art-head"><span class="art-num">${i + 1}</span><span class="art-name">${esc(x.ej.nombre)}</span></div>
      ${mediaCliente(x.ej)}
      <div class="specs"><div><b>${esc(x.series)}</b><span>Series</span></div><div><b>${esc(x.reps)}</b><span>Repeticiones</span></div><div><b>${Number(x.descanso_seg) >= 60 ? `${Math.floor(x.descanso_seg / 60)}:${pad(x.descanso_seg % 60)}` : esc(x.descanso_seg) + "s"}</b><span>Descanso</span></div></div>
      ${x.nota ? `<p class="art-note">${esc(x.nota)}</p>` : ""}
    </article>`).join("")}
  </div>
  ${estiramientos.length ? `<div class="stretch"><h3>Al terminar</h3><p>Realiza estiramientos al finalizar el entrenamiento.</p><div class="stretch-row">${estiramientos.map(e => `<figure><img src="${esc(e.imagen)}" alt="" loading="lazy"><figcaption>${esc(e.nombre.replace(/^Estiramiento de /, ""))}</figcaption></figure>`).join("")}</div></div>` : ""}`;
  return `<div class="client">${cover}${arts}<div class="client-foot">¿Dudas con algún ejercicio? Contesta el mensaje de WhatsApp y tu entrenador te responde.</div></div>`;
}
const estiramientosDe = list => list.filter(e => e.grupo === "Estiramientos" && e.imagen);
function vPreview() {
  const dias = Array.from({ length: 7 }, (_, i) => addDays(S.week, i));
  if (!dias.includes(S.previewFecha)) S.previewFecha = dias.includes(HOY) ? HOY : dias[0];
  const r = rutinaDe(S.memb, S.previewFecha), c = receptores(S.memb)[0];
  const chips = dias.map(f => `<button class="pill" data-act="pv" data-id="${f}" aria-pressed="${f === S.previewFecha}">${DIAS[dayIdx(f)].slice(0, 3)}</button>`).join("");
  const phone = r ? clientePage(r, itemsDe(r.id), S.config.marca || "Pedro Barron", estiramientosDe(S.ejercicios), { saludo: c ? `Para ${c.nombre.split(" ")[0]}` : "" })
    : `<div class="empty-state" style="margin:20px">${posesHTML()}<h4>Sin rutina</h4><p>Este día aún no tiene rutina. Ármala en La semana.</p><button class="btn primary" data-act="edit" data-f="${S.previewFecha}">Armar ${DIAS[dayIdx(S.previewFecha)]}</button></div>`;
  return `
  <div class="preview-layout">
    <div>
      <h2 class="headline">Lo que ve tu cliente</h2>
      <p class="dek">Es la página que abre desde el link de WhatsApp: una portada con la rutina del día, cada ejercicio con su dibujo o su video, y los estiramientos al final. Se ve en cualquier celular sin instalar nada.</p>
      <div class="filters" style="margin-top:16px">${chips}</div>
      ${r ? `<div class="panel" style="margin-top:8px"><h3>Link de este día</h3><code style="overflow-wrap:anywhere;font-size:13px">${esc(linkCliente(r.id, c?.id))}</code><div class="toolbar"><button class="btn small" data-act="copy-link">Copiar link</button></div></div>` : ""}
    </div>
    <div class="phone">${phone}</div>
  </div>`;
}

/* ---------- vista: ajustes ---------- */
function vAjustes() {
  const c = S.config;
  return `
  <div class="section-head"><div><h2 class="headline">Ajustes</h2><p class="dek">Hora de envío y el mensaje que reciben los clientes.</p></div></div>
  <form id="cfg-form" class="panel" style="max-width:720px" novalidate>
    <div class="grid2">
      <div class="field"><label for="cfg-marca">Nombre del entrenador</label><input type="text" id="cfg-marca" value="${esc(c.marca)}" maxlength="30"><span class="help">Se usa en el título de la pestaña y en los textos de la página.</span></div>
      <div class="field"><label for="cfg-hora">Hora de envío diario</label><input type="time" id="cfg-hora" value="${esc(c.hora_envio)}"></div>
    </div>
    <div class="field"><label for="cfg-url">Dirección de la página del cliente</label><input type="url" id="cfg-url" value="${esc(c.url_vista)}" placeholder="https://tu-usuario.github.io/pedro-barron/"><span class="help">Donde publiques este mismo archivo. El link de cada día se arma con esta dirección.</span></div>
    <div class="field"><label for="cfg-plantilla">Mensaje de WhatsApp</label><textarea id="cfg-plantilla" rows="4">${esc(c.plantilla)}</textarea><span class="help">Usa {nombre}, {titulo} y {link}. Se reemplazan por el nombre del cliente, el título del día y el link de su rutina.</span></div>
    <span class="err" id="cfg-err" hidden></span>
    <div class="toolbar"><button type="submit" class="btn primary">Guardar ajustes</button>${!DEMO ? '<button type="button" class="btn ghost" data-act="logout">Cerrar sesión</button>' : ""}</div>
  </form>`;
}
async function saveConfig(ev) {
  ev.preventDefault();
  const row = { marca: $("#cfg-marca").value.trim() || "Pedro Barron", hora_envio: $("#cfg-hora").value || "06:30", url_vista: $("#cfg-url").value.trim(), plantilla: $("#cfg-plantilla").value };
  if (!row.plantilla.includes("{link}")) { const er = $("#cfg-err"); er.textContent = "El mensaje debe incluir {link} para que el cliente pueda abrir su rutina."; er.hidden = false; return; }
  try { await DB.update("config", S.config.id || 1, row); await loadAll(); render(); toast("Ajustes guardados."); }
  catch (err) { toast("No se pudo guardar: " + err.message); }
}

/* ---------- confirmación en dos pasos (sin confirm()) ---------- */
function armed(btn, label) {
  if (btn.dataset.armed === "1") return true;
  btn.dataset.armed = "1"; const prev = btn.textContent; btn.textContent = label; btn.classList.add("danger-armed");
  setTimeout(() => { if (btn.isConnected) { btn.dataset.armed = "0"; btn.textContent = prev; btn.classList.remove("danger-armed"); } }, 3500);
  return false;
}

/* ---------- eventos ---------- */
document.addEventListener("click", async ev => {
  const b = ev.target.closest("[data-act]"); if (!b || b.disabled) return;
  const a = b.dataset.act, id = b.dataset.id;
  switch (a) {
    case "view": S.view = id; render(); window.scrollTo({ top: 0 }); autoRefreshEnvios(); break;
    case "memb": S.memb = id; render(); break;
    case "week": S.week = Number(b.dataset.n) ? addDays(S.week, Number(b.dataset.n)) : mondayOf(HOY); render(); break;
    case "copy-week": b.disabled = true; await copyWeek(); break;
    case "edit": openEditor(b.dataset.f); break;
    case "close": $("#dlg").close(); break;
    case "color": S.edit.color = id; document.querySelectorAll(".swatch").forEach(s => s.setAttribute("aria-pressed", s.dataset.id === id)); break;
    case "ex-add": S.edit.items.push({ k: uid(), ejercicio_id: id, series: 4, reps: "10-12", descanso_seg: 90, nota: "" }); refreshExList(); toast(`${ejDe(id).nombre} agregado.`); break;
    case "ex-up": case "ex-down": { const it = S.edit.items, i = it.findIndex(x => x.k === id), j = a === "ex-up" ? i - 1 : i + 1; [it[i], it[j]] = [it[j], it[i]]; refreshExList(); break; }
    case "ex-del": S.edit.items = S.edit.items.filter(x => x.k !== id); refreshExList(); break;
    case "save-day": b.disabled = true; await saveDay(); b.disabled = false; break;
    case "del-day": if (armed(b, "Toca otra vez para borrar")) await deleteDay(); break;
    case "fcli": S.fCli = id; render(); break;
    case "cli-new": openCliente(null); break;
    case "cli-edit": openCliente(id); break;
    case "cli-toggle": { const c = S.clientes.find(x => x.id === id); await DB.update("clientes", id, { activo: !c.activo }); await loadAll(); render(); toast(c.activo ? `${c.nombre} pausado. Ya no recibe rutinas.` : `${c.nombre} reactivado.`); break; }
    case "cli-del": if (armed(b, "Toca otra vez para eliminar")) { await DB.removeWhere("envios", "cliente_id", id); await DB.remove("clientes", id); await loadAll(); $("#dlg").close(); render(); toast("Cliente eliminado."); } break;
    case "fgrupo": S.fGrupo = id; render(); break;
    case "ej-new": openEjercicio(null); break;
    case "ej-edit": openEjercicio(id); break;
    case "ej-del": if (armed(b, "Toca otra vez para eliminar")) { await DB.remove("ejercicios", id); await loadAll(); $("#dlg").close(); render(); toast("Ejercicio eliminado."); } break;
    case "envday": S.envFecha = addDays(S.envFecha, Number(b.dataset.n)); render(); break;
    case "send-now": b.disabled = true; await sendNow(id, b.dataset.m); break;
    case "resend": b.disabled = true; await resend(id); break;
    case "pv": S.previewFecha = id; render(); break;
    case "copy-link": { const code = b.closest(".panel").querySelector("code"); try { await navigator.clipboard.writeText(code.textContent); toast("Link copiado."); } catch { const rg = document.createRange(); rg.selectNodeContents(code); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(rg); toast("Selecciona y copia el link."); } break; }
    case "logout": await sb.auth.signOut(); location.reload(); break;
  }
});
let qT;
document.addEventListener("input", ev => {
  const t = ev.target;
  if (t.dataset.e && S.edit) {
    S.edit[t.dataset.e] = t.type === "checkbox" ? t.checked : t.value;
    if (t.dataset.e === "descanso") { $("#ed-ex").hidden = t.checked; if (t.checked && !S.edit.titulo) { S.edit.titulo = "Descanso"; $("#ed-titulo").value = "Descanso"; } }
    if (t.dataset.e === "titulo") $("#ed-err").hidden = true;
  }
  if (t.dataset.it && S.edit) { const it = S.edit.items.find(x => x.k === t.dataset.it); if (it) it[t.dataset.k] = t.value; }
  if (t.dataset.pk) { if (t.dataset.pk === "grupo") { S.pickGrupo = t.value; S.pickQ = ""; $("#pk-q").value = ""; } else S.pickQ = t.value; $("#pk-grid").innerHTML = pickerGridHTML(); }
  if (t.dataset.f === "qCli" || t.dataset.f === "qEj") {
    S[t.dataset.f] = t.value; clearTimeout(qT);
    qT = setTimeout(() => { const pos = t.selectionStart, idSel = "#" + t.id; render(); const q = $(idSel); q.focus(); q.setSelectionRange(pos, pos); }, 200);
  }
});
document.addEventListener("change", ev => {
  const t = ev.target;
  if (t.dataset.f === "envFecha" && t.value) { S.envFecha = t.value; render(); }
  if (t.dataset.pk === "grupo") { S.pickGrupo = t.value; S.pickQ = ""; $("#pk-q").value = ""; $("#pk-grid").innerHTML = pickerGridHTML(); }
});
document.addEventListener("submit", ev => { if (ev.target.id === "cfg-form") saveConfig(ev); if (ev.target.id === "ed-form") ev.preventDefault(); });

/* ---------- arranque ---------- */
function loadScript(src) { return new Promise((ok, no) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => no(new Error("No cargó " + src)); document.head.appendChild(s); }); }
async function publicClient(rid) {
  const app = $("#app");
  app.innerHTML = `<div class="client-standalone"><div class="loading">${posesHTML()}Cargando tu rutina...</div></div>`;
  try {
    let r, items, marca = "Pedro Barron", estir = [];
    if (DEMO) { await loadAll(); r = S.rutinas.find(x => x.id === rid); items = r ? itemsDe(r.id) : []; marca = S.config.marca; estir = estiramientosDe(S.ejercicios); }
    else {
      r = (await DB.where("rutinas", "id", rid))[0];
      const rex = r ? await DB.where("rutina_ejercicios", "rutina_id", rid) : [];
      const ids = [...new Set(rex.map(x => x.ejercicio_id))];
      const { data: ej } = ids.length ? await sb.from("ejercicios").select("*").in("id", ids) : { data: [] };
      const { data: st } = await sb.from("ejercicios").select("*").eq("grupo", "Estiramientos");
      const { data: cfg } = await sb.from("config").select("marca").limit(1);
      marca = cfg?.[0]?.marca || marca; estir = estiramientosDe(st || []);
      items = rex.sort((a, b) => a.orden - b.orden).map(x => ({ ...x, ej: ej.find(e => e.id === x.ejercicio_id) || SIN_EJ }));
    }
    document.title = r ? `${r.titulo} | ${marca}` : marca;
    app.innerHTML = r ? `<div class="client-standalone">${clientePage(r, items, marca, estir)}</div>`
      : `<div class="client-standalone"><div class="empty-state" style="margin:40px 16px">${posesHTML()}<h4>Rutina no encontrada</h4><p>El link puede estar incompleto. Pídele a tu entrenador que te lo reenvíe.</p></div></div>`;
  } catch (err) {
    app.innerHTML = `<div class="client-standalone"><div class="empty-state" style="margin:40px 16px"><h4>No cargó tu rutina</h4><p>Revisa tu conexión y vuelve a abrir el link.</p></div></div>`;
  }
}
function loginView() {
  $("#app").innerHTML = `<div class="strip"><span>Classic Champion · Cambia tu físico</span><span>Panel del entrenador</span></div>
  <div class="wrap"><form class="login panel" id="login-form" novalidate>
    <img class="lockup" src="img/lockup.webp" alt="Pedro Barron. Cambia tu físico" style="width:100%">
    <div class="field"><label for="l-mail">Correo</label><input type="email" id="l-mail" autocomplete="username" required></div>
    <div class="field"><label for="l-pass">Contraseña</label><input type="password" id="l-pass" autocomplete="current-password" required></div>
    <span class="err" id="l-err" hidden></span>
    <button class="btn primary" type="submit">Entrar</button>
  </form></div>`;
  $("#login-form").addEventListener("submit", async ev => {
    ev.preventDefault();
    const { error } = await sb.auth.signInWithPassword({ email: $("#l-mail").value.trim(), password: $("#l-pass").value });
    if (error) { $("#l-err").textContent = "Correo o contraseña incorrectos."; $("#l-err").hidden = false; return; }
    startPanel();
  });
}
async function startPanel() {
  render();
  try { await loadAll(); render(); }
  catch (err) { $("#app").innerHTML = shell(`<div class="empty-state"><h4>No se pudieron cargar los datos</h4><p>${esc(err.message)}. Revisa la URL y la clave de Supabase en la configuración del archivo.</p></div>`); }
}
(async function init() {
  const rid = new URLSearchParams(location.search).get("r");
  if (!DEMO) {
    try { await loadScript("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"); sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY); }
    catch (err) { $("#app").innerHTML = `<div class="wrap"><div class="empty-state" style="margin:40px 0"><h4>Sin conexión</h4><p>No se pudo cargar la librería de Supabase. Revisa tu internet.</p></div></div>`; return; }
  }
  if (rid) return publicClient(rid);
  if (!DEMO) { const { data } = await sb.auth.getSession(); if (!data.session) return loginView(); }
  startPanel();
})();
</script>
